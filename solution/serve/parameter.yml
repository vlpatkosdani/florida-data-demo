# fabric-cicd 1.4.0 parameter file: Serve layer.
#
# SM_Sales is an import model that loads the Contoso parquet files straight from the
# GitHub releases of vlpatkosdani/semantic-model-refresh-test. The M parameter DataTag
# picks the release, so the environments differ only in data volume:
#   PPE  -> data-1m-v1   (fast refresh while testing)
#   PROD -> data-10m-v1  (the "real" volume)
#
# Regex mode: fabric-cicd replaces only capture group 1, so the rest of the
# expression (meta, List, DefaultValue) stays untouched.
#
# After the first deploy to a new workspace the model needs its Web data source
# credentials set once (Anonymous) and a refresh; fabric-cicd does not set credentials.

find_replace:
  - find_value: 'expression DataTag = "(data-[^"]+)"'
    is_regex: "true"
    replace_value:
      PPE: "data-1m-v1"
      PROD: "data-10m-v1"
    item_type: "SemanticModel"
    item_name: "SM_Sales"
