# How this file works (why it exists, step-by-step deployment flow): see solution/engineering/config.yml
# fabric-cicd 1.4.0 deployment config: Store layer (lakehouse only).
# Feature workspaces never get this layer; they read the PPE lakehouse.
core:
  workspace:
    PPE: _Florida-Store-PPE
    PROD: _Florida-Store-PROD
    TEST: _Florida-Store-TEST
  repository_directory: .
  item_types_in_scope:
    - Lakehouse

publish:
  skip:
    PPE: false
    PROD: false
    TEST: false

unpublish:
  # Never let a deployment delete a lakehouse: data does not come back.
  skip:
    PPE: true
    PROD: true
    TEST: true
