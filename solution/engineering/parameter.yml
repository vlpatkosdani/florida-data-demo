# fabric-cicd 1.4.0 parameter file: Engineering layer.
#
# Notebooks get their storage location from vl_settings (variable library),
# so most environment values are handled by value sets, not by this file.
# This file covers the one thing value sets can't: when a developer attaches
# Store_LH as the default lakehouse in a feature workspace, Fabric writes the
# PPE lakehouse and workspace GUIDs into the notebook META block.
#
# The lakehouse lives in a different workspace (Florida-Store-*), so the
# replacement uses the cross-workspace form:
#   $workspace.<workspace name>.$items.<type>.<item name>.$<attribute>
# A plain $items.Lakehouse.Store_LH.$id would look in the Engineering
# workspace and fail.
#
# TODO (Stage 4): replace __PPE_STORE_LH_ID__ with the real GUID once
# Store_LH exists in Florida-Store-PPE (b64d3ac2-... is that workspace).

find_replace:
  - find_value: "__PPE_STORE_LH_ID__"
    replace_value:
      PPE: "$workspace.Florida-Store-PPE.$items.Lakehouse.Store_LH.$id"
      PROD: "$workspace.Florida-Store-PROD.$items.Lakehouse.Store_LH.$id"
    item_type: "Notebook"

  - find_value: "b64d3ac2-7a25-4b7a-80ee-7dabc987cac9"
    replace_value:
      PPE: "$workspace.Florida-Store-PPE.$id"
      PROD: "$workspace.Florida-Store-PROD.$id"
    item_type: "Notebook"
