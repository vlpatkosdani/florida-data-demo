name: deploy-prod

# Push to main (merged PR or promotion) publishes every layer to PROD with fabric-cicd.
on:
  push:
    branches: [main]
    paths: ["solution/**"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      SPN_TENANT_ID: ${{ vars.SPN_TENANT_ID }}
      SPN_CLIENT_ID: ${{ vars.SPN_CLIENT_ID }}
      SPN_CLIENT_SECRET: ${{ secrets.SPN_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deploy store -> engineering -> serve to PROD
        run: python automation/scripts/deploy.py --environment PROD
